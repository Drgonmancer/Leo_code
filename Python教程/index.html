<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Python 全栈入门教程</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="description" content="Python 全栈入门教程 - 8 大篇章边学边练">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root { --theme-color: #42b983; }
    .sidebar-nav > ul > li > p { font-weight: 600; }
    .markdown-section img { max-width: 100%; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    // 参考 DataWhale llm-universe：极简配置，不手动设置 basePath / relativePath
    window.$docsify = {
      name: 'Python 全栈入门教程',
      repo: 'https://github.com/Drgonmancer/Leo_code',
      homepage: 'README.md',
      loadSidebar: true,
      auto2top: true,
      subMaxLevel: 3,
      maxLevel: 4,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/C1/(.*)': '/01-Python基础语法/$1',
        '/C2/(.*)': '/02-Python面向对象编程/$1',
        '/C3/(.*)': '/03-Linux命令/$1',
        '/C4/(.*)': '/04-Web服务器/$1',
        '/C5/(.*)': '/05-多任务编程/$1',
        '/C6/(.*)': '/06-Web前端开发基础/$1',
        '/C7/(.*)': '/07-MySQL数据库/$1',
        '/C8/(.*)': '/08-Redis数据库/$1',
        '/附录/(.*)': '/99-附录-项目部署/$1'
      },
      pagination: {
        previousText: '上一节',
        nextText: '下一节'
      },
      copyCode: {
        buttonText: '复制',
        successText: '已复制'
      },
      plugins: [
        function(hook, vm) {
          hook.beforeEach(function(content) {
            // 配图统一走站点根目录，避免深层目录相对路径错乱
            var base = vm.config.basePath || '/';
            return content
              .replace(/\]\(\.\.\/assets\//g, '](' + base + 'assets/')
              .replace(/!\[([^\]]*)\]\(\.\.\/assets\//g, '![$1](' + base + 'assets/')
              .replace(/!\[([^\]]*)\]\(assets\//g, '![$1](' + base + 'assets/');
          });
        }
      ]
    };
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
  <script>mermaid.initialize({ startOnLoad: true, theme: 'default' });</script>
</body>
</html>
