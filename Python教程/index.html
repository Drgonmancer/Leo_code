<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Python 全栈入门教程</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Python 全栈入门教程 - 从零到实战，8 大篇章边学边练">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css">
  <style>
    :root { --theme-color: #42b983; }
    .sidebar-nav > ul > li > p { font-weight: 600; }
    .markdown-section img {
      max-width: 100%;
      border-radius: 6px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    (function () {
      var repo = 'Leo_code';
      var onGithubPages = location.hostname.indexOf('github.io') > -1;
      window.__DOCSIFY_BASE__ = onGithubPages ? '/' + repo + '/' : '/';
    })();

    window.$docsify = {
      name: 'Python 全栈入门教程',
      nameLink: '/',
      repo: 'https://github.com/Drgonmancer/Leo_code',
      basePath: window.__DOCSIFY_BASE__,
      homepage: 'README.md',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 4,
      auto2top: true,
      coverpage: true,
      onlyCover: false,
      mergeNavbar: true,
      maxLevel: 4,
      routerMode: 'hash',
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },
      search: {
        paths: 'auto',
        placeholder: '搜索教程...',
        noData: '没有找到结果',
        depth: 4
      },
      pagination: {
        previousText: '上一节',
        nextText: '下一节',
        crossChapter: true,
        crossChapterText: '章节'
      },
      copyCode: {
        buttonText: '复制',
        errorText: '错误',
        successText: '已复制'
      },
      plugins: [
        function(hook) {
          var base = window.__DOCSIFY_BASE__;

          // 统一资源路径：配图始终从站点根目录加载
          hook.beforeEach(function(content) {
            return content
              .replace(/\]\(\.\.\/assets\//g, '](' + base + 'assets/')
              .replace(/!\[([^\]]*)\]\(\.\.\/assets\//g, '![$1](' + base + 'assets/')
              .replace(/!\[([^\]]*)\]\(assets\//g, '![$1](' + base + 'assets/');
          });

        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
  <script>mermaid.initialize({ startOnLoad: true, theme: 'default' });</script>
</body>
</html>
